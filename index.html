<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리의 365일</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Our 365 Days ❤️</h1>
        <p class="subtitle">함께한 지 벌써 1년이 되었네</p>

        <!-- 편지 영역 -->
        <div class="letter-box">
            <p>처음 만나서 지금까지 함께 웃고 울었던 소중한 시간들.</p>
            <p>앞으로도 우리 더 예쁘게 사랑하자. 많이 사랑해!</p>
        </div>

        <!-- 사진 갤러리 영역 -->
        <div class="gallery">
            <!-- 사진을 추가하려면 아래 <img> 태그를 복사해서 쓰세요 -->
            <div class="photo-card">
                <img src="images/photo1.jpg" alt="추억 사진 1">
                <p class="photo-desc">우리의 첫 데이트 날</p>
            </div>
            <div class="photo-card">
                <img src="images/photo2.jpg" alt="추억 사진 2">
                <p class="photo-desc">바다 보러 갔던 날</p>
            </div>
        </div>
    </div>
</body>
</html>
